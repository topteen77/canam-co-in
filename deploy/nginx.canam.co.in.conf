# Production — canam.co.in
# Place in: /etc/nginx/sites-available/canam.co.in
# Enable:   sudo ln -s /etc/nginx/sites-available/canam.co.in /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Adjust root / proxy ports to match server .env (PORT=5001 by default).

server {
    listen 80;
    listen [::]:80;
    server_name canam.co.in www.canam.co.in;

    # Redirect HTTP → HTTPS (requires certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canam.co.in www.canam.co.in;

    # ssl_certificate     /etc/letsencrypt/live/canam.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/canam.co.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/myapp/dist;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
