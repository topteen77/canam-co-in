# Staging — dev.canam.co.in (never indexed by Google)
# Place in: /etc/nginx/sites-available/dev.canam.co.in
# Enable:   sudo ln -s /etc/nginx/sites-available/dev.canam.co.in /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Adjust root / proxy ports to match staging .env (e.g. PORT=5002).

server {
    listen 80;
    listen [::]:80;
    server_name dev.canam.co.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.canam.co.in;

    # ssl_certificate     /etc/letsencrypt/live/dev.canam.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.canam.co.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Hard block indexing at the HTTP layer
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    root /var/www/myapp-staging/dist;
    index index.html;

    client_max_body_size 25m;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }
}
